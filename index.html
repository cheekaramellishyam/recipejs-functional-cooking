<!DOCTYPE html>
<html>
<head>
  <title>Recipe App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Recipe App</h1>

  <div class="filters">
    <button>All</button>
    <button>Easy</button>
    <button>Medium</button>
    <button>Hard</button>
    <button>Quick (&lt;30 min)</button>
  </div>

  <div class="sort">
    <button>Sort Name</button>
    <button>Sort Time</button>
    <button>Default</button>
  </div>

  <div class="recipe">
    <h2>Pasta</h2>
    <p>Difficulty: easy</p>
    <p>Time: 20 mins</p>
  </div>

  <div class="recipe">
    <h2>Salad</h2>
    <p>Difficulty: easy</p>
    <p>Time: 10 mins</p>
  </div>

  <div class="recipe">
    <h2>Burger</h2>
    <p>Difficulty: medium</p>
    <p>Time: 25 mins</p>
  </div>

  <div class="recipe">
    <h2>Fried Rice</h2>
    <p>Difficulty: medium</p>
    <p>Time: 30 mins</p>
  </div>
<script src="app.js"></script>

</body>
</html>
