<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecipeJS - Part 3</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
}

#recipe-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.recipe-card {
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

button {
    margin-top: 5px;
    padding: 6px 10px;
    border: none;
    background: #333;
    color: white;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background: #555;
}

.steps-container,
.ingredients-container {
    display: none;
    margin-top: 10px;
}

.steps-container.visible,
.ingredients-container.visible {
    display: block;
}

.steps-container ol {
    padding-left: 20px;
}

.level-1 { margin-left: 15px; }
.level-2 { margin-left: 30px; }
</style>
</head>

<body>

<h1>RecipeJS - Functional Cooking Companion</h1>
<div id="recipe-container"></div>

<script>

const RecipeApp = (() => {

    console.log("RecipeApp initializing...");

    const recipeContainer = document.getElementById("recipe-container");

    let recipes = [

        {
            id: 1,
            title: "Pasta",
            difficulty: "easy",
            time: 20,
            ingredients: ["Pasta", "Salt", "Water", "Tomato Sauce", "Olive Oil"],
            steps: [
                "Boil water",
                "Add pasta",
                {
                    text: "Prepare sauce",
                    substeps: [
                        "Heat oil",
                        "Add tomato sauce",
                        {
                            text: "Add spices",
                            substeps: ["Salt", "Chili flakes"]
                        }
                    ]
                },
                "Drain and mix",
                "Serve hot"
            ]
        },

        {
            id: 2,
            title: "Salad",
            difficulty: "easy",
            time: 10,
            ingredients: ["Lettuce", "Tomato", "Cucumber", "Salt", "Lemon"],
            steps: [
                "Wash vegetables",
                "Chop vegetables",
                "Mix together",
                "Add seasoning",
                "Serve fresh"
            ]
        },

        {
            id: 3,
            title: "Biryani",
            difficulty: "hard",
            time: 60,
            ingredients: ["Rice", "Chicken", "Spices", "Onions", "Yogurt"],
            steps: [
                "Cook rice",
                {
                    text: "Prepare chicken masala",
                    substeps: [
                        "Fry onions",
                        "Add chicken",
                        "Add spices",
                        {
                            text: "Cook thoroughly",
                            substeps: ["Simmer 20 mins", "Check tenderness"]
                        }
                    ]
                },
                "Layer rice and masala",
                "Steam 10 minutes",
                "Serve"
            ]
        },

        {
            id: 4,
            title: "Burger",
            difficulty: "medium",
            time: 25,
            ingredients: ["Buns", "Patty", "Lettuce", "Tomato", "Cheese"],
            steps: [
                "Cook patty",
                "Toast buns",
                "Assemble ingredients",
                "Add sauces",
                "Serve"
            ]
        },

        {
            id: 5,
            title: "Omelette",
            difficulty: "easy",
            time: 8,
            ingredients: ["Eggs", "Salt", "Pepper", "Butter"],
            steps: [
                "Beat eggs",
                "Heat pan",
                "Pour mixture",
                "Flip carefully",
                "Serve hot"
            ]
        },

        {
            id: 6,
            title: "Pizza",
            difficulty: "medium",
            time: 40,
            ingredients: ["Dough", "Tomato Sauce", "Cheese", "Toppings"],
            steps: [
                "Prepare dough",
                "Spread sauce",
                "Add toppings",
                "Bake 20 minutes",
                "Slice and serve"
            ]
        },

        {
            id: 7,
            title: "Fried Rice",
            difficulty: "medium",
            time: 30,
            ingredients: ["Rice", "Vegetables", "Soy Sauce", "Oil"],
            steps: [
                "Heat oil",
                "Add vegetables",
                "Add rice",
                "Add soy sauce",
                "Stir fry well"
            ]
        },

        {
            id: 8,
            title: "Smoothie",
            difficulty: "easy",
            time: 5,
            ingredients: ["Banana", "Milk", "Honey", "Ice"],
            steps: [
                "Add ingredients to blender",
                "Blend until smooth",
                "Pour into glass",
                "Serve chilled"
            ]
        }

    ];

    const renderSteps = (steps, level = 0) => {
        let html = "<ol>";

        steps.forEach(step => {
            if (typeof step === "string") {
                html += `<li class="level-${level}">${step}</li>`;
            } else {
                html += `<li class="level-${level}">${step.text}`;
                html += renderSteps(step.substeps, level + 1);
                html += "</li>";
            }
        });

        html += "</ol>";
        return html;
    };

    const createRecipeCard = (recipe) => {
        return `
            <div class="recipe-card">
                <h3>${recipe.title}</h3>
                <p>Difficulty: ${recipe.difficulty}</p>
                <p>Time: ${recipe.time} mins</p>

                <button class="toggle-btn" data-toggle="steps">
                    Show Steps
                </button>

                <button class="toggle-btn" data-toggle="ingredients">
                    Show Ingredients
                </button>

                <div class="steps-container">
                    ${renderSteps(recipe.steps)}
                </div>

                <div class="ingredients-container">
                    <ul>
                        ${recipe.ingredients.map(i => `<li>${i}</li>`).join("")}
                    </ul>
                </div>
            </div>
        `;
    };

    const renderRecipes = () => {
        recipeContainer.innerHTML = recipes.map(createRecipeCard).join("");
    };

    const handleToggleClick = (e) => {
        const button = e.target.closest(".toggle-btn");
        if (!button) return;

        const card = button.closest(".recipe-card");
        const type = button.dataset.toggle;
        const container = card.querySelector(`.${type}-container`);

        container.classList.toggle("visible");

        button.textContent =
            container.classList.contains("visible")
            ? `Hide ${type.charAt(0).toUpperCase() + type.slice(1)}`
            : `Show ${type.charAt(0).toUpperCase() + type.slice(1)}`;
    };

    const init = () => {
        renderRecipes();
        recipeContainer.addEventListener("click", handleToggleClick);
        console.log("RecipeApp ready!");
    };

    return { init };

})();

document.addEventListener("DOMContentLoaded", RecipeApp.init);

</script>

</body>
</html>
